<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .painting-container{
      background-color: whitesmoke;
      width: 748px;
      height: 748px;
      margin: auto;

      display: grid;
      grid-template-rows: 418.5px 305px auto;
      grid-template-columns: 324.5px auto;
      /* gap: 9px; */
    }
    .red-box{
      background-color: red;
      border-right: 4.5px solid black;
      border-bottom: 4.5px solid black;
    }
    .empty-box-1{
      border-left: 4.5px solid black;
      border-bottom: 4.5px solid black;;
    }
    .empty-box-2{
      border-top: 4.5px solid black;
      border-right: 4.5px solid black;
      border-bottom: 4.5px solid black;
    }

    .complex-box{
      display: grid;
      order: 1;
      grid-template-columns: 369px auto;
      grid-template-rows: 134.5px auto;
    }
    .complex-span-box{
      grid-row: span 2;
      border: 4.5px solid black;
    }
    .complex-blue-box{
      background-color: #004592;
      border: 4.5px solid black;
      border-right: 0px;
      border-bottom: 14.5px solid black;
    }
    .complex-empty-box{
      border-top: 4.5px solid black;
      border-left: 4.5px solid black;
    }

    .empty-box-3{
      order: 2;
      border-top: 4.5px solid black;
      border-right: 4.5px solid black;
    }

    .empty-box-4{
      order:3;
      display: flex;
      flex-direction: row;
    }
    .emptybox4-yellow{
      background-color: #F9D01E;
      width: 198px;
      height: 20px;
      border-top: 4.5px solid black;
      border-left: 4.5px solid black;
      border-right: 4.5px solid black;
    }
    .emptybox4-black{
      background-color: black;
      width: 153px;
      height: 20px;
      border-top: 4.5px solid black;
      border-left: 4.5px solid black;
      border-right: 4.5px solid black;
    }
    .emptybox4-empty{
      border-left: 4.5px solid black;
    }

  </style>
</head>

<body>
  <!-- Write your HTML here -->
  <div class="painting-container">
    <div class="red-box"></div>
    <div class="empty-box-1"></div>
    <div class="empty-box-2"></div>
    <div class="complex-box">
      <div class="complex-span-box"></div>
      <div class="complex-blue-box"></div>
      <div class="complex-empty-box"></div>
    </div>
    <div class="empty-box-3"></div>
    <div class="empty-box-4">
      <div class="emptybox4-yellow"></div>
      <div class="emptybox4-black"></div>
      <div class="emptybox4-empty"></div>
    </div>
  </div>
</body>

</html>
