<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
        /*
    Source - https://stackoverflow.com/a/47914693
    Posted by eriklharper, modified by community. See post 'Timeline' for change history
    Retrieved 2026-07-15, License - CC BY-SA 4.0
    */

    .border {
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(auto, auto));
      grid-gap: 1px;
      background-color: gray;
    }
    .grid > div {
      background-color: white;
      padding: 10px;
    }
  </style>
</head>
<body>
      <!--
    Source - https://stackoverflow.com/a/47914693
    Posted by eriklharper, modified by community. See post 'Timeline' for change history
    Retrieved 2026-07-15, License - CC BY-SA 4.0
    -->

    <div class="border">
      <div class="grid">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
      </div>
    </div>
</body>
</html>
