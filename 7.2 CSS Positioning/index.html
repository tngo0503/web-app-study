<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */

    div.blue-box > div.red-circle{
      background-color: red;
      width: 500px;
      height: 300px;
      position: absolute;
    }

    div.blue-box{
      background-color: blue;
      width:500px;
      height: 300px;
      position: relative;
    }

    .brown-box{
      background-color: brown;
      width: 200px;
      height: 200px;
    }
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

  <div class="brown-box"></div>

</body>

</html>
